<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="WikiScroll" />
  <meta name="theme-color" content="#0a0a0a" />
  <title>WikiScroll</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0a;
      --card-bg: #111;
      --text: #f0ede6;
      --muted: rgba(240,237,230,0.5);
      --accent: #c8a96e;
      --accent2: #7eb8c8;
      --radius: 18px;
    }

    html, body {
      height: 100%;
      max-height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior: none;
      position: fixed;
      width: 100%;
    }

    /* ── FEED ── */
    #feed {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      overflow-y: scroll;
      scroll-snap-type: y mandatory;
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    #feed::-webkit-scrollbar { display: none; }

    /* ── CARD ── */
    .card {
      height: 100svh;
      scroll-snap-align: start;
      scroll-snap-stop: always;
      position: relative;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .card-image {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      filter: brightness(0.45) saturate(0.8);
      transition: filter 0.5s ease;
    }
    .card:hover .card-image { filter: brightness(0.5) saturate(0.9); }

    .card-noise {
      position: absolute;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      opacity: 0.6;
    }

    .card-gradient {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to bottom,
        transparent 0%,
        rgba(10,10,10,0.2) 30%,
        rgba(10,10,10,0.85) 65%,
        rgba(10,10,10,0.98) 100%
      );
    }

    .card-content {
      position: relative;
      z-index: 2;
      margin-top: auto;
      padding: 28px 24px calc(28px + env(safe-area-inset-bottom));
    }

    .card-category {
      font-family: 'DM Sans', sans-serif;
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .card-category::before {
      content: '';
      display: inline-block;
      width: 20px;
      height: 1.5px;
      background: var(--accent);
    }

    .card-title {
      font-family: 'Playfair Display', serif;
      font-size: clamp(26px, 6vw, 36px);
      font-weight: 900;
      line-height: 1.15;
      color: var(--text);
      margin-bottom: 14px;
      text-shadow: 0 2px 20px rgba(0,0,0,0.5);
    }

    .card-summary {
      font-size: 14px;
      font-weight: 300;
      line-height: 1.7;
      color: rgba(240,237,230,0.82);
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.4s ease, opacity 0.4s ease;
      opacity: 0;
    }
    .card.expanded .card-summary {
      max-height: 300px;
      opacity: 1;
    }

    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 16px;
    }

    .card-source {
      font-size: 11px;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 6px;
      text-decoration: none;
    }
    .card-source svg { opacity: 0.6; }

    .card-expand {
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 50px;
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 12px;
      font-weight: 500;
      padding: 7px 16px;
      cursor: pointer;
      transition: background 0.2s, transform 0.15s;
      -webkit-backdrop-filter: blur(8px);
      backdrop-filter: blur(8px);
    }
    .card-expand:active { transform: scale(0.95); }
    .card.expanded .card-expand { background: rgba(200,169,110,0.2); border-color: var(--accent); color: var(--accent); }

    /* ── SWIPE HINT ── */
    .swipe-hint {
      position: absolute;
      bottom: calc(90px + env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      z-index: 10;
      animation: hintFade 3s ease 1.5s forwards;
      opacity: 0;
    }
    .swipe-hint span {
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    .swipe-arrow {
      width: 1.5px;
      height: 28px;
      background: linear-gradient(to bottom, transparent, var(--muted));
      animation: arrowBounce 1.2s ease-in-out infinite;
    }
    @keyframes hintFade {
      0% { opacity: 0; }
      20% { opacity: 1; }
      80% { opacity: 1; }
      100% { opacity: 0; pointer-events: none; }
    }
    @keyframes arrowBounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(6px); }
    }

    /* ── HEADER ── */
    #header {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      padding: calc(14px + env(safe-area-inset-top)) 24px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: linear-gradient(to bottom, rgba(10,10,10,0.7) 0%, transparent 100%);
      pointer-events: none;
    }

    .logo {
      font-family: 'Playfair Display', serif;
      font-size: 20px;
      font-weight: 900;
      letter-spacing: -0.02em;
      color: var(--text);
    }
    .logo span { color: var(--accent); }

    /* ── LOADING ── */
    .card-loading {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      background: var(--card-bg);
    }
    .spinner {
      width: 36px; height: 36px;
      border: 2px solid rgba(200,169,110,0.2);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { font-size: 13px; color: var(--muted); }

    /* ── ERROR STATE ── */
    .card-error {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: var(--card-bg);
      padding: 32px;
      text-align: center;
    }
    .card-error p { color: var(--muted); font-size: 14px; }
    .retry-btn {
      margin-top: 8px;
      padding: 10px 22px;
      background: var(--accent);
      color: #111;
      border: none;
      border-radius: 50px;
      font-family: 'DM Sans', sans-serif;
      font-weight: 500;
      cursor: pointer;
    }

    /* ── PLACEHOLDER GRADIENT BACKGROUNDS ── */
    .placeholder-0 { background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460); }
    .placeholder-1 { background: linear-gradient(135deg, #0d1b2a, #1b4332, #2d6a4f); }
    .placeholder-2 { background: linear-gradient(135deg, #2d1b69, #11998e, #38ef7d); }
    .placeholder-3 { background: linear-gradient(135deg, #2c1654, #4a1942, #7b2d8b); }
    .placeholder-4 { background: linear-gradient(135deg, #1a0a00, #7b4019, #d4890a); }
  </style>
</head>
<body>

<div id="header">
  <div class="logo">Wiki<span>Scroll</span></div>
</div>

<div id="feed"></div>

<script>
// ── CONFIG ──────────────────────────────────────────────────────────────────
const API_KEY_STORAGE = 'wikiscroll_apikey';
let ANTHROPIC_API_KEY = localStorage.getItem(API_KEY_STORAGE) || '';
const CACHE_KEY = 'wikiscroll_cache_v1';
const CACHE_MAX = 200; // max summaries stored
const PRELOAD_AHEAD = 2; // how many cards to preload ahead

// Curated starting topics — Wikipedia will give us random featured articles too
const SEED_TOPICS = [
  'Black hole', 'Ancient Rome', 'Quantum mechanics', 'Great Barrier Reef',
  'Nikola Tesla', 'Amazon rainforest', 'Jazz music', 'Mount Everest',
  'Viking Age', 'DNA', 'Aurora borealis', 'Silk Road', 'Supernova',
  'Sahara Desert', 'Chess', 'Machu Picchu', 'Artificial intelligence',
  'Octopus', 'French Revolution', 'Stonehenge'
];

// ── CACHE ────────────────────────────────────────────────────────────────────
function loadCache() {
  try { return JSON.parse(localStorage.getItem(CACHE_KEY) || '{}'); }
  catch { return {}; }
}
function saveCache(cache) {
  // Trim if too large
  const keys = Object.keys(cache);
  if (keys.length > CACHE_MAX) {
    keys.slice(0, keys.length - CACHE_MAX).forEach(k => delete cache[k]);
  }
  try { localStorage.setItem(CACHE_KEY, JSON.stringify(cache)); } catch {}
}
let summaryCache = loadCache();

// ── WIKIPEDIA ────────────────────────────────────────────────────────────────
const usedTopics = new Set();
let topicQueue = [...SEED_TOPICS.sort(() => Math.random() - 0.5)];

async function getRandomArticle() {
  // Try queue first, then random
  let title = null;
  while (topicQueue.length > 0) {
    const candidate = topicQueue.shift();
    if (!usedTopics.has(candidate)) { title = candidate; break; }
  }

  if (!title) {
    // Fetch a random Wikipedia article title
    const res = await fetch('https://en.wikipedia.org/api/rest_v1/page/random/summary');
    const data = await res.json();
    title = data.title;
  }

  if (usedTopics.has(title)) return getRandomArticle();
  usedTopics.add(title);

  const res = await fetch(`https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(title)}`);
  if (!res.ok) return getRandomArticle();
  const data = await res.json();

  if (!data.extract || data.extract.length < 100) return getRandomArticle();

  return {
    title: data.title,
    extract: data.extract,
    image: data.originalimage?.source || data.thumbnail?.source || null,
    url: data.content_urls?.desktop?.page || `https://en.wikipedia.org/wiki/${encodeURIComponent(title)}`,
    description: data.description || '',
  };
}

// ── CLAUDE SUMMARIZER ─────────────────────────────────────────────────────────
async function summarize(article) {
  const cacheKey = article.title;
  if (summaryCache[cacheKey]) return summaryCache[cacheKey];

  const response = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'x-api-key': ANTHROPIC_API_KEY, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' },
    body: JSON.stringify({
      model: 'claude-sonnet-4-20250514',
      max_tokens: 600,
      system: `You write for a TikTok-style knowledge app. Given a Wikipedia article, output ONLY a raw JSON object with these three fields:
- "hook": one punchy sentence, max 12 words, no period. A secret or plot twist that makes someone stop scrolling.
- "summary": exactly 3 complete sentences. Each should feel like a revelation with vivid, specific details. Always finish every sentence fully — never cut one short.
- "category": one word like Science, History, Nature, Tech, Art, Space, War, Food, etc.
Output raw JSON only, no markdown fences.`,
      messages: [{ role: 'user', content: `Title: ${article.title}\n\n${article.extract.slice(0, 1200)}` }]
    })
  });

  const data = await response.json();
  const text = data.content?.[0]?.text || '';
  let parsed;
  try {
    parsed = JSON.parse(text.replace(/```json|```/g, '').trim());
  } catch {
    parsed = { hook: article.title, summary: article.extract.slice(0, 300), category: 'Knowledge' };
  }

  summaryCache[cacheKey] = parsed;
  saveCache(summaryCache);
  return parsed;
}

// ── CARD BUILDER ─────────────────────────────────────────────────────────────
function buildLoadingCard() {
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `<div class="card-loading"><div class="spinner"></div><p class="loading-text">Discovering…</p></div>`;
  return card;
}

function populateCard(card, article, ai) {
  const ph = `placeholder-${Math.floor(Math.random() * 5)}`;
  card.innerHTML = `
    ${article.image
      ? `<div class="card-image" style="background-image:url('${article.image}')"></div>`
      : `<div class="card-image ${ph}"></div>`
    }
    <div class="card-noise"></div>
    <div class="card-gradient"></div>
    <div class="card-content">
      <div class="card-category">${ai.category || 'Knowledge'}</div>
      <h2 class="card-title">${article.title}</h2>
      <p class="card-summary">${ai.summary}</p>
      <div class="card-footer">
        <a class="card-source" href="${article.url}" target="_blank" rel="noopener">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
          Wikipedia
        </a>
        <button class="card-expand">Read more</button>
      </div>
    </div>
  `;

  // Hook overlay (shown before expand)
  const hookEl = document.createElement('div');
  hookEl.style.cssText = `position:absolute;top:50%;left:24px;right:24px;transform:translateY(-50%);z-index:3;pointer-events:none;`;
  hookEl.innerHTML = `<p style="font-family:'Playfair Display',serif;font-size:clamp(18px,5vw,26px);font-weight:700;color:rgba(240,237,230,0.9);text-shadow:0 2px 30px rgba(0,0,0,0.7);line-height:1.3;text-align:center;">${ai.hook}</p>`;
  card.appendChild(hookEl);

  // Expand button toggle
  const btn = card.querySelector('.card-expand');
  btn.addEventListener('click', () => {
    card.classList.toggle('expanded');
    hookEl.style.opacity = card.classList.contains('expanded') ? '0' : '1';
    btn.textContent = card.classList.contains('expanded') ? 'Less' : 'Read more';
  });

  // Tap anywhere on image area to expand too
  card.addEventListener('click', (e) => {
    if (!e.target.closest('.card-content')) {
      card.classList.toggle('expanded');
      hookEl.style.opacity = card.classList.contains('expanded') ? '0' : '1';
      btn.textContent = card.classList.contains('expanded') ? 'Less' : 'Read more';
    }
  });
}

function showError(card, retry) {
  card.innerHTML = `<div class="card-error"><p>Couldn't load this article.</p><button class="retry-btn">Try another</button></div>`;
  card.querySelector('.retry-btn').addEventListener('click', retry);
}

// ── FEED LOGIC ────────────────────────────────────────────────────────────────
const feed = document.getElementById('feed');
let cardCount = 0;
let activeLoads = 0;

async function addCard() {
  // Allow up to PRELOAD_AHEAD concurrent loads
  if (activeLoads >= PRELOAD_AHEAD) return;
  activeLoads++;

  const card = buildLoadingCard();
  feed.appendChild(card);

  // Swipe hint on first card
  if (cardCount === 0) {
    const hint = document.createElement('div');
    hint.className = 'swipe-hint';
    hint.innerHTML = `<span>Swipe up</span><div class="swipe-arrow"></div>`;
    card.appendChild(hint);
  }
  cardCount++;

  try {
    const article = await getRandomArticle();
    const ai = await summarize(article);
    populateCard(card, article, ai);
  } catch (err) {
    console.error(err);
    showError(card, () => { feed.removeChild(card); cardCount--; addCard(); });
  }

  activeLoads--;
}

// Infinite scroll: when second-to-last card is visible, load more
const observer = new IntersectionObserver((entries) => {
  entries.forEach(e => {
    if (e.isIntersecting) addCard();
  });
}, { threshold: 0.5 });

function observeSecondToLast() {
  const cards = feed.querySelectorAll('.card');
  if (cards.length < 2) return;
  observer.disconnect();
  observer.observe(cards[cards.length - 2]);
}

new MutationObserver(observeSecondToLast).observe(feed, { childList: true });

// ── ONBOARDING ────────────────────────────────────────────────────────────────
function showOnboarding() {
  const screen = document.createElement('div');
  screen.id = 'onboarding';
  screen.style.cssText = `
    position:fixed;inset:0;z-index:999;background:#0a0a0a;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:40px 32px;gap:0;font-family:'DM Sans',sans-serif;
  `;
  screen.innerHTML = `
    <p style="font-family:'Playfair Display',serif;font-size:38px;font-weight:900;color:#f0ede6;margin-bottom:6px;">Wiki<span style="color:#c8a96e;">Scroll</span></p>
    <p style="font-size:13px;color:rgba(240,237,230,0.45);letter-spacing:0.12em;text-transform:uppercase;margin-bottom:40px;">Knowledge, one swipe at a time</p>

    <div style="width:100%;max-width:340px;display:flex;flex-direction:column;gap:12px;">
      <p style="font-size:14px;color:rgba(240,237,230,0.7);line-height:1.6;margin-bottom:4px;">
        Paste your <a href="https://console.anthropic.com" target="_blank" style="color:#c8a96e;text-decoration:none;">Anthropic API key</a> to get started. It's stored only on your device, never sent anywhere else.
      </p>
      <input
        id="key-input"
        type="password"
        placeholder="sk-ant-..."
        autocomplete="off"
        spellcheck="false"
        style="
          width:100%;padding:14px 16px;border-radius:12px;border:1.5px solid rgba(255,255,255,0.12);
          background:rgba(255,255,255,0.05);color:#f0ede6;font-family:'DM Sans',sans-serif;
          font-size:14px;outline:none;transition:border-color 0.2s;
          -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
        "
      />
      <p id="key-error" style="font-size:12px;color:#e07070;display:none;margin-top:-4px;">Please enter a valid key (starts with sk-ant-)</p>
      <button id="key-submit" style="
        width:100%;padding:15px;border-radius:12px;border:none;
        background:#c8a96e;color:#0a0a0a;font-family:'DM Sans',sans-serif;
        font-size:15px;font-weight:600;cursor:pointer;
        transition:opacity 0.2s,transform 0.15s;margin-top:4px;
      ">Start scrolling →</button>
    </div>

    <p style="font-size:11px;color:rgba(240,237,230,0.25);margin-top:32px;text-align:center;max-width:280px;line-height:1.6;">
      Your key is saved locally and used only to summarise Wikipedia articles. Cost is typically &lt;$0.01 per session.
    </p>
  `;
  document.body.appendChild(screen);

  const input = screen.querySelector('#key-input');
  const btn = screen.querySelector('#key-submit');
  const err = screen.querySelector('#key-error');

  input.addEventListener('focus', () => input.style.borderColor = '#c8a96e');
  input.addEventListener('blur', () => input.style.borderColor = 'rgba(255,255,255,0.12)');
  input.addEventListener('keydown', e => { if (e.key === 'Enter') btn.click(); });

  btn.addEventListener('click', () => {
    const val = input.value.trim();
    if (!val.startsWith('sk-ant-') && !val.startsWith('sk-')) {
      err.style.display = 'block';
      input.style.borderColor = '#e07070';
      return;
    }
    ANTHROPIC_API_KEY = val;
    localStorage.setItem(API_KEY_STORAGE, val);
    screen.style.opacity = '0';
    screen.style.transition = 'opacity 0.4s ease';
    setTimeout(() => screen.remove(), 400);
    startFeed();
  });

  btn.addEventListener('mousedown', () => btn.style.transform = 'scale(0.97)');
  btn.addEventListener('mouseup', () => btn.style.transform = '');
}

// ── INIT ──────────────────────────────────────────────────────────────────────
if (!ANTHROPIC_API_KEY) {
  showOnboarding();
} else {
  addCard();
  addCard();
}

function startFeed() {
  addCard();
  addCard();
}
</script>
</body>
</html>
